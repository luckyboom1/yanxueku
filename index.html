<body>
<div class="loading-shield" id="loading-screen">
  <div class="loading-pulse"></div>
  <div class="loading-text">研学库加载中…</div>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="logo"><div class="logo-badge">研</div><span><em>研学库</em></span></div>
    <div class="nav-item active" data-view="dashboard" role="button" tabindex="0" onclick="switchView('dashboard')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchView('dashboard')}"><span class="ico">🏠</span>学习仪表盘<span class="nav-badge" id="badge-due" style="display:none"></span></div>
    <div class="nav-item" data-view="library" role="button" tabindex="0" onclick="switchView('library')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchView('library')}"><span class="ico">📚</span>知识库</div>
    <div class="nav-item" data-view="review" role="button" tabindex="0" onclick="switchView('review')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchView('review')}"><span class="ico">🧠</span>记忆复习</div>
    <div class="nav-item" data-view="public-library" role="button" tabindex="0" onclick="switchView('public-library')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchView('public-library')}"><span class="ico">🏛️</span>公共课程库</div>
    <div class="nav-item" data-view="quiz" role="button" tabindex="0" onclick="switchView('quiz')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchView('quiz')}"><span class="ico">✍️</span>刷题自测</div>
    <div class="nav-item" data-view="wrong" role="button" tabindex="0" onclick="switchView('wrong')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchView('wrong')}"><span class="ico">📕</span>错题本<span class="nav-badge" id="badge-wrong" style="display:none"></span></div>
    <div class="nav-item" data-view="stats" role="button" tabindex="0" onclick="switchView('stats')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchView('stats')}"><span class="ico">📊</span>学习统计</div>
    <div class="nav-item" data-view="mine" role="button" tabindex="0" onclick="switchView('mine')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchView('mine')}"><span class="ico">👤</span>我的</div>
    <div id="sidebar-user-area"></div>
    <div class="side-label" style="display:flex;align-items:center;justify-content:space-between">专业科目 <button class="add-subj-btn" onclick="openNewSubjectModal(event)" title="新建科目">＋ 新建</button></div>
    <div id="subj-list"></div>
    
  <div class="side-label">⏱ 学习计时</div>
  <div id="sidebar-timer" style="text-align:center;font-size:22px;font-weight:800;letter-spacing:1px;padding:6px 0;color:var(--primary);font-variant-numeric:tabular-nums" title="今日学习时长">00:00</div>
  <div style="font-size:11px;color:var(--text-3);text-align:center;margin-top:-6px">累计 <span id="sidebar-total">0时0分</span> · 复习/刷题自动计入</div>
  <div id="sync-status" style="font-size:11px;color:var(--text-3);text-align:center;margin-top:2px;transition:color .3s">已保存</div>

  <div class="side-foot">
      <button class="foot-btn" onclick="exportData()" title="导出全部数据">⬇ 导出</button>
      <button class="foot-btn" onclick="document.getElementById('import-file').click()" title="从备份 JSON 恢复数据">⬆ 恢复备份</button>
      <button class="foot-btn" id="theme-btn" onclick="cycleTheme()" title="切换主题">🌓 主题</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
      <input type="file" id="import-cards-file" accept=".txt,.md" style="display:none" onchange="importCardsFile(event)">
      <input type="file" id="import-pack-file" accept=".json" style="display:none" onchange="importCardPackFile(event)">
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button class="icon-btn" onclick="toggleSidebar()" title="收起/展开侧栏">☰</button>
      <div>
        <div id="page-title">学习仪表盘</div>
        <div id="page-sub"></div>
      </div>
      <div class="top-actions">
        <button class="btn btn-ghost" onclick="openKwModal()"><span class="btn-plus">＋</span><span class="btn-label"> 记知识点</span></button>
        <button class="btn btn-primary" onclick="startReview()">▶ 开始今日复习</button>
      </div>
    </header>

    <div id="content">
      <section id="view-dashboard" class="view active"></section>
      <section id="view-library" class="view"></section>
      <section id="view-review" class="view"></section>
      <section id="view-quiz" class="view"></section>
      <section id="view-wrong" class="view"></section>
      <section id="view-stats" class="view"></section>
      <section id="view-mine" class="view"></section>
      <section id="view-public-library" class="view"></section>
    </div>
  </main>
</div>

<div id="toast-root"></div>
