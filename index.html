<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="研学库">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>研学库 · 考研专业课高效学习</title>
<!-- Supabase SDK（云同步/登录依赖；加载失败自动回退本地模式） -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#f4f5fb; --bg-grad:radial-gradient(1200px 600px at 80% -10%, rgba(99,102,241,.10), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(14,165,233,.08), transparent 60%), #f4f5fb;
  --surface:#ffffff; --surface-2:#f8f9fd; --surface-glass:rgba(255,255,255,.72);
  --border:#e6e8f2; --border-strong:#d5d9e8;
  --text:#1b1e2e; --text-2:#5a5f7a; --text-3:#9aa0bd;
  --primary:#6366f1; --primary-2:#8b5cf6; --accent:#0ea5e9;
  --grad:linear-gradient(135deg,#6366f1,#8b5cf6);
  --success:#10b981; --warn:#f59e0b; --danger:#ef4444;
  --shadow-sm:0 1px 2px rgba(27,30,46,.05),0 2px 8px rgba(27,30,46,.05);
  --shadow-md:0 4px 16px rgba(27,30,46,.08),0 1px 4px rgba(27,30,46,.05);
  --shadow-lg:0 12px 40px rgba(27,30,46,.13);
  --radius:16px; --radius-sm:10px;
}
html[data-theme="dark"]{
  --bg:#0e1020; --bg-grad:radial-gradient(1200px 600px at 80% -10%, rgba(99,102,241,.16), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(14,165,233,.10), transparent 60%), #0e1020;
  --surface:#171a2e; --surface-2:#1d2138; --surface-glass:rgba(23,26,46,.75);
  --border:#272b47; --border-strong:#343a5c;
  --text:#eef0fb; --text-2:#a3a9c9; --text-3:#6b7194;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 16px rgba(0,0,0,.35); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  background:var(--bg-grad); color:var(--text); font-size:14px; line-height:1.6;
  transition:background .3s,color .3s; overflow:hidden;
}
#app{display:flex;height:100vh}

/* ---------- Sidebar ---------- */
#sidebar{
  width:240px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--surface-glass);backdrop-filter:blur(20px) saturate(180%);
  border-right:1px solid var(--border);padding:20px 14px;gap:4px;
  transition:margin .3s cubic-bezier(.16,1,.3,1);z-index:20;
}
#sidebar.collapsed{margin-left:-240px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-size:17px;font-weight:700;letter-spacing:.5px}
.logo-badge{width:34px;height:34px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;box-shadow:0 4px 12px rgba(99,102,241,.35)}
.logo span em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;cursor:pointer;
  color:var(--text-2);font-weight:500;transition:all .2s;border:1px solid transparent;user-select:none;
}
.nav-item .ico{font-size:16px;width:22px;text-align:center}
.nav-item:hover{background:var(--surface-2);color:var(--text);transform:translateX(2px)}
.nav-item.active{background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(139,92,246,.10));color:var(--primary);border-color:rgba(99,102,241,.25);font-weight:600}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600}
.side-label{font-size:11px;color:var(--text-3);font-weight:600;letter-spacing:1.5px;padding:16px 12px 6px}
.subj-item{display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:10px;cursor:pointer;color:var(--text-2);font-size:13px;transition:all .2s;user-select:none}
.subj-item:hover{background:var(--surface-2);color:var(--text)}
.subj-item.active{background:var(--surface-2);color:var(--text);font-weight:600}
.subj-dot{width:9px;height:9px;border-radius:4px;flex-shrink:0}
.subj-count{margin-left:auto;font-size:11px;color:var(--text-3)}
.subj-del{display:none;width:18px;height:18px;border-radius:6px;border:none;background:transparent;color:var(--text-3);font-size:11px;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;transition:all .15s}
.subj-item:hover .subj-del{display:inline-flex}
.subj-del:hover{background:rgba(239,68,68,.12);color:var(--danger)}
.side-foot{margin-top:auto;display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--border)}
.foot-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:12px;cursor:pointer;transition:all .2s;font-family:inherit}
.foot-btn:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}

/* ---------- Main ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{
  display:flex;align-items:center;gap:14px;padding:14px 28px;
  background:var(--surface-glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:inherit}
.icon-btn:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
#page-title{font-size:17px;font-weight:700}
#page-sub{font-size:12px;color:var(--text-3)}
.top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:12px;border:none;cursor:pointer;
  font-size:13px;font-weight:600;font-family:inherit;transition:all .25s cubic-bezier(.16,1,.3,1);white-space:nowrap;
}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.35)}
.btn-primary:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 8px 22px rgba(99,102,241,.45)}
.btn-primary:active{transform:translateY(0) scale(.98)}
.btn-ghost{background:var(--surface);color:var(--text-2);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}

#content{flex:1;overflow-y:auto;padding:26px 28px 40px;scroll-behavior:smooth}
.view{display:none;animation:viewIn .35s cubic-bezier(.16,1,.3,1)}
.view.active{display:block}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- Cards & grids ---------- */
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:all .3s cubic-bezier(.16,1,.3,1);
}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.stat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--sc,var(--grad))}
.stat-num{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.15}
.stat-num small{font-size:14px;font-weight:600;color:var(--text-3);letter-spacing:0}
.stat-label{font-size:12.5px;color:var(--text-2);margin-top:2px}
.stat-ico{position:absolute;right:16px;top:16px;font-size:22px;opacity:.85}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:22px;margin-bottom:20px}
.panel-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel-title .sub{font-size:12px;color:var(--text-3);font-weight:400;margin-left:auto}

/* ---------- Knowledge cards ---------- */
.kw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.kw-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;
  box-shadow:var(--shadow-sm);transition:all .3s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden;
}
.kw-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--border-strong)}
.kw-card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc,var(--primary));border-radius:4px 0 0 4px}
.kw-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.kw-chapter{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);font-weight:600}
.kw-due{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600}
.kw-due.today{background:rgba(239,68,68,.12);color:var(--danger)}
.kw-due.soon{background:rgba(245,158,11,.12);color:var(--warn)}
.kw-due.later{background:rgba(16,185,129,.1);color:var(--success)}
.kw-title{font-size:15px;font-weight:700;margin-bottom:6px;line-height:1.4}
.kw-preview{font-size:12.5px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px}
.kw-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(99,102,241,.08);color:var(--primary);font-weight:500}
.mastery{margin-left:auto;display:flex;gap:2px}
.mastery i{width:14px;height:5px;border-radius:3px;background:var(--border)}
.mastery i.on{background:var(--kc,var(--primary))}

/* ---------- Filters ---------- */
.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:200px;max-width:360px}
.search-box input{
  width:100%;padding:10px 14px 10px 38px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
  font-size:13px;font-family:inherit;color:var(--text);outline:none;transition:all .2s;
}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.search-box .s-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:14px}
.chip{padding:7px 15px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;cursor:pointer;color:var(--text-2);transition:all .2s;font-weight:500;user-select:none}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(99,102,241,.3)}

/* ---------- Flashcard ---------- */
.review-wrap{max-width:640px;margin:0 auto}
.review-progress{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.rp-bar{flex:1;height:8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}
.rp-fill{height:100%;background:var(--grad);border-radius:6px;transition:width .4s cubic-bezier(.16,1,.3,1)}
.rp-text{font-size:12.5px;color:var(--text-2);font-weight:600;white-space:nowrap}
.flashcard{perspective:1400px;height:340px;cursor:pointer;margin-bottom:20px}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:34px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-md);overflow-y:auto;
}
.fc-back{transform:rotateY(180deg);justify-content:flex-start;text-align:left;align-items:stretch}
.fc-chapter{font-size:12px;padding:3px 12px;border-radius:20px;background:rgba(99,102,241,.1);color:var(--primary);font-weight:600;margin-bottom:18px}
.fc-title{font-size:24px;font-weight:800;line-height:1.4}
.fc-hint{margin-top:26px;font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.fc-back .fc-content{font-size:14.5px;line-height:1.9;color:var(--text)}
.fc-back .fc-content b{color:var(--primary)}
.fc-back .fc-content code{background:var(--surface-2);border:1px solid var(--border);padding:1px 6px;border-radius:6px;font-size:13px;font-family:Consolas,Monaco,monospace;color:var(--primary-2)}
.grade-row{display:flex;gap:12px;justify-content:center}
.grade-btn{flex:1;max-width:180px;padding:14px;border-radius:14px;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;color:#fff;transition:all .25s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;align-items:center;gap:3px}
.grade-btn small{font-size:11px;font-weight:500;opacity:.85}
.grade-btn:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.grade-btn:active{transform:scale(.97)}
.g-forgot{background:linear-gradient(135deg,#ef4444,#f87171)}
.g-blur{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.g-good{background:linear-gradient(135deg,#10b981,#34d399)}
.empty-state{text-align:center;padding:70px 20px;color:var(--text-2)}
.empty-state .big{font-size:52px;margin-bottom:14px}
.empty-state h3{font-size:18px;color:var(--text);margin-bottom:6px}

/* ---------- Quiz ---------- */
.quiz-setup{max-width:560px;margin:30px auto}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0 20px}
.opt-card{padding:13px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface-2);cursor:pointer;text-align:center;font-weight:600;transition:all .2s;font-size:13px}
.opt-card:hover{border-color:var(--primary);transform:translateY(-2px)}
.opt-card.sel{border-color:var(--primary);background:rgba(99,102,241,.08);color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.q-card{max-width:680px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:30px;box-shadow:var(--shadow-md)}
.q-meta{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.q-type{font-size:11.5px;padding:3px 10px;border-radius:20px;font-weight:700}
.q-type.single{background:rgba(14,165,233,.12);color:var(--accent)}
.q-type.judge{background:rgba(139,92,246,.12);color:var(--primary-2)}
.q-text{font-size:17px;font-weight:700;line-height:1.6;margin-bottom:20px}
.q-opt{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:12px;border:1.5px solid var(--border);margin-bottom:10px;cursor:pointer;transition:all .2s;background:var(--surface-2)}
.q-opt:hover:not(.locked){border-color:var(--primary);transform:translateX(4px)}
.q-opt .key{width:26px;height:26px;border-radius:8px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0}
.q-opt.correct{border-color:var(--success);background:rgba(16,185,129,.08)}
.q-opt.correct .key{background:var(--success);color:#fff;border-color:var(--success)}
.q-opt.wrong{border-color:var(--danger);background:rgba(239,68,68,.07)}
.q-opt.wrong .key{background:var(--danger);color:#fff;border-color:var(--danger)}
.q-opt.locked{cursor:default}
.q-explain{margin-top:16px;padding:14px 16px;border-radius:12px;background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.2);font-size:13px;line-height:1.7;animation:viewIn .3s}
.q-explain b{color:var(--primary)}
.q-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.q-result-badge{font-size:14px;font-weight:700}
.q-result-badge.ok{color:var(--success)}.q-result-badge.no{color:var(--danger)}
.score-ring{width:150px;height:150px;margin:10px auto 16px;position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring .val b{font-size:34px;font-weight:800}
.score-ring .val span{font-size:12px;color:var(--text-3)}

/* ---------- Wrong book / list rows ---------- */
.row-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm);transition:all .25s}
.row-item:hover{box-shadow:var(--shadow-md)}
.row-item .q-text{font-size:14.5px;margin-bottom:10px}
.row-foot{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.mini-btn{padding:6px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);font-size:12px;font-weight:600;cursor:pointer;color:var(--text-2);transition:all .2s;font-family:inherit}
.mini-btn:hover{border-color:var(--primary);color:var(--primary)}
.mini-btn.danger:hover{border-color:var(--danger);color:var(--danger)}

/* ---------- Stats ---------- */
.stats-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:980px){.stats-grid{grid-template-columns:1fr}}
canvas#chart-days{width:100%;height:260px}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:9px}
.legend-item{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text-2)}
.legend-item .dot{width:11px;height:11px;border-radius:4px}
.legend-item b{margin-left:auto;color:var(--text)}
.subj-bar-row{margin-bottom:16px}
.subj-bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.subj-bar-head b{font-weight:600}
.subj-bar-head span{color:var(--text-3);font-size:12px}
.subj-bar{height:9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}
.subj-bar i{display:block;height:100%;border-radius:6px;transition:width .8s cubic-bezier(.16,1,.3,1)}

/* ---------- Modal ---------- */
#modal-root{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:1100}
#modal-root.open{display:flex}
.modal-mask{position:absolute;inset:0;background:rgba(15,17,32,.45);backdrop-filter:blur(6px);animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.modal{
  position:relative;width:min(620px,92vw);max-height:86vh;overflow-y:auto;background:var(--surface);
  border:1px solid var(--border);border-radius:20px;padding:26px;box-shadow:var(--shadow-lg);
  animation:modalIn .35s cubic-bezier(.16,1,.3,1);
}
@keyframes modalIn{from{opacity:0;transform:translateY(24px) scale(.97)}}
.modal h3{font-size:17px;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;font-size:14px;transition:all .2s}
.modal-close:hover{color:var(--danger);border-color:var(--danger)}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.form-row input,.form-row select,.form-row textarea{
  width:100%;padding:10px 13px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);
  font-size:13px;font-family:inherit;color:var(--text);outline:none;transition:all .2s;resize:vertical;
}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.14);background:var(--surface)}
.pwd-wrap{display:flex;gap:6px}
.pwd-wrap input{flex:1}
.pwd-eye{width:40px;height:40px;flex-shrink:0;border:1px solid var(--border);border-radius:11px;background:var(--surface-2);color:var(--text-2);cursor:pointer;font-size:15px;font-family:inherit;transition:all .2s}
.pwd-eye:hover{border-color:var(--primary);color:var(--primary)}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

let db;
let _loadResolve = null;
let _currentUser = null, _profile = null;   // 提前声明，避免 load() 中访问触发 TDZ
const _dbReady = new Promise(r => { _loadResolve = r; });
async function load(){
  // Supabase 查询包在 try/catch 里：任何异常都不影响本地回退
  if(sb){
    try{
      const uid = _currentUser ? _currentUser.id : null;
      const { data } = uid ? await sb.from('app_state').select('data').eq('user_id', uid).maybeSingle() : {data: null};
      if(data && data.data && data.data.subjects){
        db = data.data;
        _loadResolve(db);
        setupRealtimeSync();
        hideLoading();
        return;
      }
    }catch(e){ console.warn('Supabase load failed, using local:', e.message); }
  }
  // Fallback: localStorage or seed
  try{
    const raw = localStorage.getItem('yanxueku_v1');
    if(raw){ db = JSON.parse(raw); _loadResolve(db); setupRealtimeSync(); hideLoading(); return; }
  }catch(e){}
  db = seedData();
  try{ await save(); }catch(e){ console.warn('save failed:', e.message); }
  _loadResolve(db);
  setupRealtimeSync();
  hideLoading();
}

}
async function save(){
  if(sb && _currentUser){
    try{ await sb.from('app_state').upsert({ user_id: _currentUser.id, data: db, updated_at: new Date().toISOString() }); }catch(e){ console.warn('Supabase save failed'); }
  }
  try{ localStorage.setItem('yanxueku_v1', JSON.stringify(db)); }catch(e){ console.warn('localStorage save failed:', e.message); } // always mirror to localStorage as backup
}
function setupRealtimeSync(){
  if(!sb) return;
  sb.channel('app_state_changes')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_state', filter: 'user_id=eq.'+(_currentUser?_currentUser.id:'') },
      payload => {
        if(payload.new && payload.new.data && payload.new.data.subjects){
          const oldUpdated = new Date(db.updated_at||0).getTime();
          const newUpdated = new Date(payload.new.data.updated_at||0).getTime();
          if(newUpdated > oldUpdated){
            db = payload.new.data;
            try{ localStorage.setItem('yanxueku_v1', JSON.stringify(db)); }catch(e){}
            if(curView) render();
            setTimeout(function(){ updateSidebarTimer(); }, 50);
            setTimeout(function(){ updateDashboardHeader(); }, 80);
          }
        }
      }
    ).subscribe();
}


function getSubject(id){ return db.subjects.find(s=>s.id===id); }
function addStudy(min){
  const t = todayStr();
  let rec = db.studyLog.find(r=>r.date===t);
  if(!rec){ rec = {date:t, minutes:0}; db.studyLog.push(rec); }
  rec.minutes += min;
  save();
}
function isDue(k){ return k.nextReview <= todayStr(); }
function dueList(){ return db.knowledge.filter(isDue).sort((a,b)=> a.nextReview < b.nextReview ? -1 : 1); }
function masteryLevel(k){ if(k.stage<=0) return 0; if(k.stage<=2) return 1; if(k.stage<=4) return 2; return 3; }
const MASTERY_NAMES = ['未掌握','初学','熟练','掌握'];
const MASTERY_COLORS = ['#94a3b8','#f59e0b','#0ea5e9','#10b981'];
function wrongList(){
  const latest = {};
  db.quizRecords.forEach(r=>{ latest[r.qid] = r; });
  return db.questions.filter(q=> latest[q.id] && !latest[q.id].correct);
}

/* ================= 主题 ================= */
function applyTheme(mode){
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = mode==='system' ? (prefersDark?'dark':'light') : mode;
  document.documentElement.setAttribute('data-theme', theme);
  const icons = {light:'☀️ 浅色', dark:'🌙 深色', system:'🌓 跟随系统'};
  const btn = document.getElementById('theme-btn');
  if(btn) btn.textContent = icons[mode] || mode;
  localStorage.setItem(THEME_KEY, mode);
  themeMode = mode;
}
let themeMode = localStorage.getItem(THEME_KEY) || 'system';
function cycleTheme(){
  const order = ['light','dark','system'];
  themeMode = order[(order.indexOf(themeMode)+1)%order.length];
  applyTheme(themeMode);
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(themeMode==='system') applyTheme('system'); });

      <div style="display:flex;align-items:flex-end;gap:10px;height:110px;padding-top:6px">

function setLibSubject(id){ libFilter.subject = id; renderLibrary(); }
function renderLibrary(){
  if(!db||!db.knowledge) return;
  const el = document.getElementById('view-library');
  const tags = [...new Set(db.knowledge.flatMap(k=>k.tags))];
  let list = db.knowledge.slice();
  if(libFilter.subject!=='all') list = list.filter(k=>k.subjectId===libFilter.subject);

  if(libFilter.search){
    const q = libFilter.search.toLowerCase();
    list = list.filter(k=> (k.title+k.content+k.chapter+k.tags.join('')).toLowerCase().includes(q));
  }
  list.sort((a,b)=> (isDue(a)?0:1)-(isDue(b)?0:1) || a.nextReview.localeCompare(b.nextReview));

  el.innerHTML = `
    <div class="filter-bar">
      <div class="search-box">
        <span class="s-ico">🔍</span>

      <span style="font-size:12px;color:var(--text-3)">标签：</span>
      ${tags.map(t=>`<div class="chip ${libFilter.tag===t?'active':''}" style="padding:5px 12px;font-size:12px" data-tag="${esc(t)}" onclick="libFilter.tag = libFilter.tag===this.dataset.tag ? '' : this.dataset.tag; renderLibrary()">${esc(t)}</div>`).join('')}
    </div>`:''}
    ${list.length? `<div class="kw-grid">${list.map(kwCard).join('')}</div>`
      : `<div class="empty-state"><div class="big">🗂️</div><h3>没有找到相关知识点</h3><p>换个关键词试试，或者新建一个知识点</p></div>`}`;
}
function kwCard(k){
  const s = getSubject(k.subjectId);
  const ml = masteryLevel(k);
  const t = todayStr();
  let dueCls, dueTxt;
  if(k.nextReview < t){ dueCls='today'; dueTxt='已逾期 '+diffDays(t,k.nextReview)+' 天'; }
  else if(k.nextReview===t){ dueCls='today'; dueTxt='今日待复习'; }
  else if(diffDays(k.nextReview,t)<=3){ dueCls='soon'; dueTxt=diffDays(k.nextReview,t)+' 天后复习'; }
  else { dueCls='later'; dueTxt=k.nextReview.slice(5).replace('-','/')+' 复习'; }
  return `<div class="kw-card" style="--kc:${s?s.color:'#6366f1'}" onclick="openKwDetail('${k.id}')">
    <div class="kw-head">
      <span class="kw-chapter">${esc(s?s.name:'')} · ${esc(k.chapter)}</span>
      <span class="kw-due ${dueCls}">${dueTxt}</span>
    </div>
    <div class="kw-title">${esc(k.title)}</div>
    <div class="kw-preview">${esc(k.content).slice(0,120)}</div>
    <div class="kw-foot">
      ${k.tags.map(tg=>`<span class="tag">${esc(tg)}</span>`).join('')}
      <span class="mastery" title="掌握度：${MASTERY_NAMES[ml]}">${[0,1,2,3].map(i=>`<i class="${i<=ml && k.stage>0 || i<ml ? 'on':''}"></i>`).join('')}</span>
    </div>
  </div>`;
}

function saveKw(id){
  const subjectId = document.getElementById('f-subject').value;
  const chapter = document.getElementById('f-chapter').value.trim() || '未分章';
  const title = document.getElementById('f-title').value.trim();
  const content = document.getElementById('f-content').value.trim();
  const tags = document.getElementById('f-tags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  if(!title){ toast('请填写标题','err'); return; }
  if(!content){ toast('请填写内容','err'); return; }
  if(id){
    const k = db.knowledge.find(x=>x.id===id);
    Object.assign(k, {subjectId, chapter, title, content, tags});
    toast('知识点已更新','ok');
  }else{
    db.knowledge.push({id:uid(), subjectId, chapter, title, content, tags, stage:0, nextReview:todayStr(), lastReview:null, createdAt:todayStr()});
    toast('已创建并加入今日复习 🎉','ok');
  }
  save(); closeModal(); render();
}
function delKw(id){
  const k = db.knowledge.find(x=>x.id===id);
  openModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3>⚠️ 确认删除</h3>
    <p style="color:var(--text-2);line-height:1.8">即将删除知识点「<b>${esc(k.title)}</b>」，删除后不可恢复，确定吗？</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" style="background:linear-gradient(135deg,#ef4444,#f87171)" onclick="doDelKw('${id}')">确认删除</button>
    </div>`);
}
function doDelKw(id){
  db.knowledge = db.knowledge.filter(k=>k.id!==id);
  save(); closeModal(); render();
  toast('已删除','info');
}

/* ================= 艾宾浩斯复习 ================= */
let reviewQueue = [], reviewIdx = 0, reviewDone = 0;
function startReview(focusId){
  let q = dueList();
  if(focusId){
    const k = db.knowledge.find(x=>x.id===focusId);
    q = k? [k] : [];
  }
  if(!q.length){ toast('今日没有待复习内容，太棒了！🎉','ok'); return; }
  reviewQueue = q; reviewIdx = 0; reviewDone = 0;
  switchView('review');
}
function renderReviewHome(){
  if(!db||!db.knowledge) return;
  const el = document.getElementById('view-review');
  if(!reviewQueue.length || reviewIdx>=reviewQueue.length){
    const due = dueList();
    if(!due.length){
      el.innerHTML = `<div class="empty-state"><div class="big">🎉</div><h3>今日复习任务全部完成</h3><p>保持节奏，艾宾浩斯会帮你把知识焊在脑子里</p>
        <button class="btn btn-primary" style="margin-top:18px" onclick="switchView('dashboard')">回到仪表盘</button></div>`;
    }else{
      reviewQueue = due; reviewIdx = 0; reviewDone = 0;
      renderFlashcard(); return;
    }
    return;
  }
  renderFlashcard();
}
function renderFlashcard(){
  const el = document.getElementById('view-review');
  const k = reviewQueue[reviewIdx];
  const s = getSubject(k.subjectId);
  el.innerHTML = `
    <div class="review-wrap">
      <div class="review-progress">
        <span class="rp-text">进度 ${reviewIdx+1} / ${reviewQueue.length}</span>

function grade(g, ev){
  ev.stopPropagation();
  const k = reviewQueue[reviewIdx];
  const t = todayStr();
  if(g===0){ k.stage = 0; k.nextReview = addDays(t, 1); }
  else if(g===1){ const iv = Math.max(1, Math.round(EBB[Math.min(k.stage,6)]/2)); k.nextReview = addDays(t, iv); }
  else { k.stage = Math.min(k.stage+1, EBB.length-1); k.nextReview = addDays(t, EBB[k.stage]); }
  k.lastReview = t;
  reviewDone++;
  addStudy(2);
  save();
  reviewIdx++;
  if(reviewIdx >= reviewQueue.length){
    addStudy(3);
    const el = document.getElementById('view-review');
    el.innerHTML = `<div class="empty-state"><div class="big">🏆</div><h3>本轮复习完成！</h3>
      <p>共复习 ${reviewDone} 个知识点，遗忘曲线已更新</p>

    reviewQueue = [];
    renderBadges();
    toast(`本轮复习完成，记忆进度已更新 ✅`,'ok');
  }else{
    renderFlashcard();
    renderBadges();
  }
}

let quiz = null; // {list, idx, right, answered}
let quizCfg = {subject:'all', count:10};
function renderQuizHome(){
  if(!db||!db.questions) return;

function startQuiz(){
  let pool = db.questions.slice();
  if(quizCfg.subject!=='all') pool = pool.filter(q=>q.subjectId===quizCfg.subject);
  if(!pool.length){ toast('该科目暂无题目','err'); return; }
  pool = pool.sort(()=>Math.random()-.5).slice(0, Math.min(quizCfg.count, pool.length));
  quiz = {list:pool, idx:0, right:0};
  renderQuestion();
}
function renderQuestion(){
  const el = document.getElementById('view-quiz');
  const q = quiz.list[quiz.idx];
  const s = getSubject(q.subjectId);
  const opts = q.type==='judge' ? ['正确','错误'] : q.options;
  el.innerHTML = `
    <div class="review-wrap" style="max-width:720px">
      <div class="review-progress">
        <span class="rp-text">第 ${quiz.idx+1} / ${quiz.list.length} 题</span>

        <span class="rp-text" style="color:var(--success)">答对 ${quiz.right}</span>
      </div>
      <div class="q-card">
        <div class="q-meta">
          <span class="q-type ${q.type}">${q.type==='judge'?'判断题':'单选题'}</span>
          <span class="kw-chapter">${esc(s?s.name:'')} · ${esc(q.chapter)}</span>
        </div>
        <div class="q-text">${esc(q.question)}</div>
        <div id="q-opts">
          ${opts.map((o,i)=>`<div class="q-opt" onclick="answerQ(${i})"><span class="key">${q.type==='judge'?(i===0?'✓':'✗'):'ABCD'[i]}</span><span>${esc(o)}</span></div>`).join('')}
        </div>
        <div id="q-feedback"></div>
      </div>
    </div>`;
}
function answerQ(i){
  const q = quiz.list[quiz.idx];
  const optEls = document.querySelectorAll('#q-opts .q-opt');
  if(optEls[0].classList.contains('locked')) return;
  const correct = i === q.answer;
  optEls.forEach((el,j)=>{
    el.classList.add('locked');
    if(j===q.answer) el.classList.add('correct');
    else if(j===i) el.classList.add('wrong');
  });
  db.quizRecords.push({qid:q.id, correct, date:todayStr()});
  addStudy(1);
  save();
  if(correct) quiz.right++;
  const isLast = quiz.idx+1 >= quiz.list.length;
  document.getElementById('q-feedback').innerHTML = `
    <div class="q-explain"><b>📖 解析：</b>${md(q.explanation)}</div>
    <div class="q-foot">
      <span class="q-result-badge ${correct?'ok':'no'}">${correct?'✅ 回答正确':'❌ 回答错误，已加入错题本'}</span>
      <button class="btn btn-primary" onclick="nextQ()">${isLast?'查看成绩 🏁':'下一题 →'}</button>
    </div>`;
  renderBadges();
}
function nextQ(){
  quiz.idx++;
  if(quiz.idx >= quiz.list.length){ renderQuizResult(); return; }
  renderQuestion();
}
function renderQuizResult(){
  const total = quiz.list.length, right = quiz.right;
  const pct = Math.round(right/total*100);
  const wrongs = quiz.list.filter(q=>{
    const recs = db.quizRecords.filter(r=>r.qid===q.id);
    return recs.length && !recs[recs.length-1].correct;
  });
  const C = 2*Math.PI*52;

            <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
          </svg>
          <div class="val"><b>${pct}</b><span>正确率 %</span></div>
        </div>
        <p style="color:var(--text-2)">${total} 题答对 ${right} 题${wrongs.length?`，${wrongs.length} 道错题已收入错题本`:'，全部答对，太稳了！'}</p>

  renderBadges();

          ${MASTERY_NAMES.map((n,i)=>`<div class="legend-item"><span class="dot" style="background:${MASTERY_COLORS[i]}"></span>${n}<b>${dist[i]}</b></div>`).join('')}
        </div></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">📚 各科目掌握进度</div>

        return `<div class="subj-bar-row">
          <div class="subj-bar-head"><b><span class="subj-dot" style="background:${s.color};display:inline-block;margin-right:6px"></span>${esc(s.name)}</b>
          <span>${ks.length} 个知识点 · ${due} 个待复习 · 掌握 ${Math.round(avg)}%</span></div>

function donutSVG(dist){
  const total = dist.reduce((a,b)=>a+b,0) || 1;
  const R = 52, C = 2*Math.PI*R;
  let off = 0;
  const segs = dist.map((v,i)=>{
    if(!v) return '';
    const len = v/total*C;
    const s = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${MASTERY_COLORS[i]}" stroke-width="16"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" style="transition:stroke-dasharray .8s"/>`;
    off += len; return s;
  }).join('');
  return `<svg width="140" height="140" viewBox="0 0 140 140" style="transform:rotate(-90deg)">${segs}
    <circle cx="70" cy="70" r="36" fill="var(--surface)"/></svg>`;
}
function drawBarChart(days){
  const cv = document.getElementById('chart-days');
  if(!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = 260;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr,dpr);
  const dark = document.documentElement.getAttribute('data-theme')==='dark';
  const cText = dark? '#a3a9c9' : '#5a5f7a';
  const cGrid = dark? '#272b47' : '#e6e8f2';
  const max = Math.max(10, ...days.map(d=>d.m));
  const padL = 34, padB = 26, padT = 14, padR = 8;
  const cw = (W-padL-padR)/days.length;
  // 网格线
  ctx.strokeStyle = cGrid; ctx.fillStyle = cText; ctx.lineWidth = 1;
  ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
  for(let g=0; g<=4; g++){
    const y = padT + (H-padT-padB)*g/4;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W-padR, y); ctx.stroke();
    ctx.fillText(Math.round(max*(4-g)/4), padL-6, y+3);
  }
  // 柱子
  const grad = ctx.createLinearGradient(0,padT,0,H-padB);
  grad.addColorStop(0,'#6366f1'); grad.addColorStop(1,'#8b5cf6');
  days.forEach((d,i)=>{
    const bh = d.m/max*(H-padT-padB);
    const x = padL + i*cw + cw*0.2, w = cw*0.6;
    const y = H-padB-bh;
    ctx.fillStyle = d.m? grad : cGrid;
    ctx.beginPath();
    const r = Math.min(5, w/2);
    if(bh>0){
      ctx.moveTo(x, y+r); ctx.arcTo(x, y, x+r, y, r); ctx.arcTo(x+w, y, x+w, y+r, r);
      ctx.lineTo(x+w, H-padB); ctx.lineTo(x, H-padB); ctx.closePath(); ctx.fill();
    }else{
      ctx.fillRect(x, H-padB-2, w, 2);
    }
    ctx.fillStyle = cText; ctx.textAlign = 'center'; ctx.font = '9.5px sans-serif';
    ctx.fillText(d.d.slice(5).replace('-','/'), padL+i*cw+cw/2, H-padB+14);
    if(d.m>0){ ctx.font = 'bold 9.5px sans-serif'; ctx.fillText(d.m, padL+i*cw+cw/2, y-4); }
  });
}

/* ================= 卡片文本导入（真经笔记 OCR 格式） ================= */
let pendingCards = null;
function cleanCardTitle(t){
  return String(t||'').trim()
    .replace(/^[（(]?[一二三四五六七八九十百]+[）)、．.]\s*/, '')
    .replace(/^\d+[、．.]\s*/, '')
    .trim();
}
function parseCardsText(text){
  text = String(text).replace(/^\uFEFF/, '');
  const HDR = /(?:20\d{2}\s*)?真经新闻史笔记[丨|1lI」]?\s*大伟的学习重要性提醒[：:]\s*([一二两三四五])星/g;
  const NOISE = [
    /(?:20\d{2}\s*)?真经新闻史笔记[丨|1lI」]?\s*大伟的学习重要性提醒[：:]\s*[一二两三四五]星/g,
    /20\d{2}\s*新传考研真经中国新闻史课程配套讲义[，,]?\s*仅供内部交流/g,
    /新传考研真经同行/g
  ];
  const lines = text.split(/\r?\n/);
  let chapter = '未分章';
  const cards = [];
  lines.forEach(raw=>{
    const line = raw.trim();
    if(!line) return;
    if(line.startsWith('#')){
      chapter = line.replace(/^#+\s*/, '').trim() || chapter;
      return;
    }
    const idx = line.indexOf('|');
    const head = idx>=0 ? line.slice(0, idx) : '';
    const body = (idx>=0 ? line.slice(idx+1) : line).trim();
    HDR.lastIndex = 0;
    const pts = [];
    let m;
    while((m = HDR.exec(body)) !== null){ if(m.index > 0) pts.push(m.index); }
    const segs = [];
    let prev = 0;
    pts.forEach(p=>{ segs.push(body.slice(prev, p)); prev = p; });
    segs.push(body.slice(prev));
    segs.forEach((seg, si)=>{
      let title = si===0 ? cleanCardTitle(head) : '';
      let star = '';
      const sm = seg.match(/重要性提醒[：:]\s*([一二两三四五])星/);
      if(sm) star = sm[1]+'星';
      let content = seg;
      NOISE.forEach(rx=>{ content = content.replace(rx, ' '); });
      content = content.replace(/\s+/g, ' ').trim();
      const pm = content.match(/^[（(][一二三四五六七八九十]+[）)]\s*([^【]{1,30}?)(?=【)/);
      if(pm){ title = pm[1].trim(); content = content.slice(pm[0].length).trim(); }
      if(!title || title.replace(/[《》<>「」“”"'\s]/g,'').length < 2){
        const bm = content.match(/《[^》]{1,20}》/);
        if(bm) title = bm[0];
        else{
          const fm = content.match(/^【[^】]*】\s*[“"]?([^，。；：]{2,15})/);
          title = fm ? fm[1].trim() : '卡片 ' + (cards.length+1);
        }
      }
      if(content.length < 10) return;
      cards.push({chapter, title, content, star});
    });
  });
  return cards;
}
function importCardsFile(ev){
  const f = ev.target.files[0];
  ev.target.value = '';
  if(!f) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const cards = parseCardsText(e.target.result);
    if(!cards.length){ toast('未解析到任何卡片，请检查文件格式','err'); return; }
    pendingCards = cards;
    showCardsImportPreview(f.name);
  };
  reader.readAsText(f);
}
function showCardsImportPreview(fname){
  const cards = pendingCards;
  const guess = /新闻史|新传|新闻/.test(fname + cards.map(c=>c.chapter).join('')) ? '中国新闻史' : fname.replace(/\.[^.]+$/,'');
  const byChapter = {};
  cards.forEach(c=>{ byChapter[c.chapter] = (byChapter[c.chapter]||0)+1; });
  const seen = {};
  const dup = cards.filter(c=>{
    const existed = db.knowledge.some(k=>k.title===c.title) || seen[c.title];
    seen[c.title] = true;
    return existed;
  }).length;
  openModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3>📥 导入预览</h3>
    <div class="form-row"><label>导入到科目（不存在则自动创建）</label>
      <input id="imp-subject" value="${esc(guess)}">
    </div>
    <div class="review-info">
      <span>📄 ${esc(fname)}</span>
      <span>🗂️ 共 <b>${cards.length}</b> 张卡片 · ${Object.keys(byChapter).length} 个章节</span>
      ${dup?`<span style="color:var(--warn)">⚠️ ${dup} 张同名卡片将自动加序号区分</span>`:''}
    </div>
    <div style="max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:12px;padding:12px 16px;background:var(--surface-2)">
      ${Object.entries(byChapter).map(([ch,n])=>`
        <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--border)">
          <span>${esc(ch)}</span><b style="color:var(--primary)">${n} 张</b>
        </div>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--text-3);margin-top:10px;line-height:1.7">
      星级标记将转为标签（如「两星」）；全部卡片进入今日复习队列。导入后可随时在知识库中编辑修正。
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="confirmCardsImport()">确认导入 ${cards.length} 张卡片</button>
    </div>`);
}
function confirmCardsImport(){
  const name = document.getElementById('imp-subject').value.trim() || '导入科目';
  let subj = db.subjects.find(s=>s.name===name);
  if(!subj){
    const palette = ['#e11d48','#7c3aed','#0891b2','#ca8a04','#16a34a','#dc2626','#2563eb'];
    subj = {id: uid(), name, color: palette[db.subjects.length % palette.length], exam:'新闻与传播'};
    db.subjects.push(subj);
  }
  let added = 0;
  const t = todayStr();
  const usedTitles = new Set(db.knowledge.filter(k=>k.subjectId===subj.id).map(k=>k.title));
  pendingCards.forEach(c=>{
    let title = c.title, n = 2;
    while(usedTitles.has(title)){ title = c.title + '（' + n + '）'; n++; }
    usedTitles.add(title);
    const tags = ['真经笔记'];
    if(c.star) tags.push(c.star);
    db.knowledge.push({
      id: uid(), subjectId: subj.id, chapter: c.chapter, title, content: c.content,
      tags, stage: 0, nextReview: t, lastReview: null, createdAt: t
    });
    added++;
  });
  pendingCards = null;
  save(); closeModal();
  libFilter.subject = subj.id;
  switchView('library');
  toast(`成功导入 ${added} 张卡片 🎉`,'ok');
}

  _activeTimer = setInterval(()=>{
    if(document.visibilityState === 'visible'){
      _activeSeconds++;

      if(_activeSeconds >= 60){

        updateSidebarTimer();
      }
    }
  }, 1000);

// --- 挖空模式 ---
let blanksMode = false;
let blankAnswers = [];
function toggleBlanksMode(){
  blanksMode = !blanksMode;
  const el = document.querySelector('.fc-back');
  if(!el) return;
  if(blanksMode){
    el.classList.add('blanks-mode');
    // 解析当前背面内容，隐藏 <b> 和 <code> 标签，替换为可点击的填空
    const original = el.innerHTML;
    if(!el.dataset.blanksOriginal) el.dataset.blanksOriginal = original;
    const bolds = el.querySelectorAll('b');
    const codes = el.querySelectorAll('code');
    blankAnswers = [];
    bolds.forEach(b => {
      const txt = b.textContent.trim();
      if(txt.length < 2 || txt.length > 25) return;
      const span = document.createElement('span');
      span.className = 'blank-reveal'; span.textContent = txt;
      span.dataset.answer = txt;
      span.onclick = function(){ this.classList.add('revealed'); this.textContent = this.dataset.answer; };
      b.replaceWith(span);
      blankAnswers.push({el: span, txt: txt});
    });
    codes.forEach(c => {
      const txt = c.textContent.trim();
      if(txt.length < 2 || txt.length > 20) return;
      const span = document.createElement('span');
      span.className = 'blank-reveal'; span.textContent = txt;
      span.dataset.answer = txt;
      span.onclick = function(){ this.classList.add('revealed'); this.textContent = this.dataset.answer; };
      c.replaceWith(span);
      blankAnswers.push({el: span, txt: txt});
    });
    // 添加计数提示
    if(blankAnswers.length > 0){
      const hint = document.createElement('div');
      hint.className = 'blank-count';
      hint.id = 'blank-hint';
      hint.textContent = '🔍 '+blankAnswers.length+' 个挖空 · 点击依次揭示';
      el.appendChild(hint);
    }
  }else{
    el.classList.remove('blanks-mode');
    el.innerHTML = el.dataset.blanksOriginal || el.innerHTML;
    el.dataset.blanksOriginal = '';
    blankAnswers = [];
  }
}

function getCountdownDate(){
  const saved = localStorage.getItem('yanxueku_exam_date');
  if(saved) return new Date(saved);
  // 默认：当前年份12月第三个周末的周六
  const now = new Date();
  const y = now.getFullYear();
  const dec = new Date(y, 11, 20); // 12月20日附近
  while(dec.getDay() !== 6) dec.setDate(dec.getDate() + 1); // 调到周六
  // 如果已经过了今年12月，用明年
  if(now > dec){ dec.setFullYear(y + 1); dec.setMonth(11); dec.setDate(20); while(dec.getDay() !== 6) dec.setDate(dec.getDate() + 1); }
  return dec;
}

let _authMode = 'login';        // login / signup
let _authSubmitting = false;    // 防重复提交
function validateEmail(s){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s==null?'':s).trim()); }
function cleanEmail(s){ return String(s==null?'':s).replace(/[\u200B-\u200D\uFEFF\u00A0\u3000]/g,'').trim(); }
// Supabase/GoTrue 错误中文化：避免用户看到英文错误码（如 invalid / rate limit exceeded）
function authErrorMsg(err){
  if(!err) return '操作失败，请重试';
  const code = String(err.error_code||err.code||err.status||'');
  if(/rate_limit|over_email|too_many/i.test(code)) return '请求过于频繁，请稍后再试（邮箱发送限额）';
  if(code==='email_address_invalid') return '邮箱地址格式无效，请检查后重试';
  if(code==='user_already_exists'||code==='user_exists') return '该邮箱已注册，请直接登录';
  if(code==='invalid_credentials') return '邮箱或密码错误';
  if(code==='weak_password'||/password/i.test(code)) return '密码强度不足，请使用至少 6 位包含字母和数字的密码';
  const m = String(err.message||'');
  if(/rate limit|too many requests/i.test(m)) return '请求过于频繁，请稍后再试';
  if(/already registered|already exists/i.test(m)) return '该邮箱已注册，请直接登录';
  if(/invalid format|invalid email/i.test(m)) return '邮箱地址格式无效，请检查后重试';
  return m || '操作失败，请重试';
}
function validatePassword(p){ return String(p==null?'':p).length >= 6; }

/* ===== Cloudflare Turnstile 人机验证（尽力而为模式） =====
 * 设计：Turnstile 可用时强制人机验证；不可用时（SDK 加载失败 /
 * 渲染失败 / 10 秒未完成验证=Cloudflare 连不上）自动降级放行，
 * 不阻塞注册 —— 面向国内用户，challenges.cloudflare.com 访问不稳定
 * 前提：Supabase 侧 CAPTCHA 需关闭强制校验（否则无 token 请求被 400 拒）
 */
const TURNSTILE_SITE_KEY = '0x4AAAAAAEGrawQkO7430Qen'; // Cloudflare Turnstile Site Key
let _captchaToken = null;
let _turnstileWidget = null;
let _turnstileSDKLoading = false;
let _captchaDegraded = false;      // true = Turnstile 不可用，允许跳过验证
let _captchaDegradeTimer = null;
function loadTurnstileSDK(cb){
  if(window.turnstile){ cb(); return; }
  if(_turnstileSDKLoading){ return; }
  _turnstileSDKLoading = true;
  var s = document.createElement('script');
  s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
  s.async = true;
  s.onload = function(){ _turnstileSDKLoading = false; cb(); };
  s.onerror = function(){ _turnstileSDKLoading = false; _captchaDegraded = true; }; // SDK 加载失败 → 降级放行
  document.head.appendChild(s);
}
function renderTurnstile(){
  if(!TURNSTILE_SITE_KEY || !window.turnstile) return;
  var holder = document.getElementById('auth-captcha');
  if(!holder || _turnstileWidget) return;
  _captchaToken = null;
  _captchaDegraded = false;
  try{
    _turnstileWidget = window.turnstile.render(holder, {
      sitekey: TURNSTILE_SITE_KEY,
      theme: document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light',
      callback: function(token){ _captchaToken = token; if(_captchaDegradeTimer){ clearTimeout(_captchaDegradeTimer); _captchaDegradeTimer = null; } },
      'expired-callback': function(){ _captchaToken = null; },
      'error-callback': function(){ _captchaToken = null; }
    });
    // 降级超时：10 秒内未完成验证（多半是 Cloudflare 连不上）→ 允许跳过
    _captchaDegradeTimer = setTimeout(function(){
      if(!_captchaToken) _captchaDegraded = true;
    }, 10000);
  }catch(e){
    _captchaDegraded = true; // 渲染异常 → 降级放行
  }
}
function resetTurnstile(){
  if(_turnstileWidget && window.turnstile){ try{ window.turnstile.reset(_turnstileWidget); }catch(e){} }
  _captchaToken = null; _captchaDegraded = false;
  if(_captchaDegradeTimer){ clearTimeout(_captchaDegradeTimer); _captchaDegradeTimer = null; }
}
function destroyTurnstile(){
  if(_turnstileWidget && window.turnstile){ try{ window.turnstile.remove(_turnstileWidget); }catch(e){} }
  _turnstileWidget = null; _captchaToken = null; _captchaDegraded = false;
  if(_captchaDegradeTimer){ clearTimeout(_captchaDegradeTimer); _captchaDegradeTimer = null; }
}
function renderAuthModal(){
  const isLogin = _authMode === 'login';
  destroyTurnstile(); // openModal 会重建 DOM，先销毁旧 widget
  const m =
    '<button class="modal-close" onclick="closeModal()">✕</button>'+
    '<h3>'+(isLogin?'👤 登录':'✨ 注册')+'</h3>'+
    (isLogin?'':'<div class="form-row"><label>昵称（选填）</label><input id="auth-name" placeholder="怎么称呼你？"></div>')+
    '<div class="form-row"><label>邮箱</label><input id="auth-email" type="email" placeholder="you@example.com"></div>'+
    '<div class="form-row"><label>密码（≥6位）</label><div class="pwd-wrap"><input id="auth-password" type="password" placeholder="至少 6 位"><button class="pwd-eye" onclick="togglePwd()" title="显示/隐藏密码">👁</button></div></div>'+
    (isLogin?'':'<div class="form-row"><label>确认密码</label><input id="auth-confirm" type="password" placeholder="再输入一次密码"></div>')+
    (isLogin?'':'<div class="form-row"><div id="auth-captcha"></div></div>')+
    '<div class="modal-actions">'+
    '<button class="btn btn-ghost" onclick="toggleAuthMode()">'+(isLogin?'去注册':'去登录')+'</button>'+
    '<button class="btn btn-primary" id="auth-submit" onclick="'+(isLogin?'doLogin':'doSignUp')+'()">'+(isLogin?'登录':'注册')+'</button>'+
    '</div>';
  openModal(m);
  if(!isLogin && TURNSTILE_SITE_KEY) loadTurnstileSDK(renderTurnstile);
}
function toggleAuthMode(){
  _authMode = _authMode === 'login' ? 'signup' : 'login';
  renderAuthModal();
}
function togglePwd(){
  const inp = document.getElementById('auth-password');
  if(inp) inp.type = inp.type === 'password' ? 'text' : 'password';
}
function openAuthModal(){
  _authMode = 'login';
  _authSubmitting = false;
  renderAuthModal();
}
function setAuthLoading(on){
  const b = document.getElementById('auth-submit');
  if(!b) return;
  if(on){ b.disabled = true; b.dataset.orig = b.textContent; b.textContent = '处理中…'; }
  else { b.disabled = false; b.textContent = b.dataset.orig || b.textContent; }
}
async function doLogin(){
  const e = cleanEmail(document.getElementById('auth-email').value);
  const p = document.getElementById('auth-password').value;
  if(!validateEmail(e)){ toast('请输入有效的邮箱地址','err'); return; }
  if(!validatePassword(p)){ toast('密码长度至少 6 位','err'); return; }
  if(!sb){ toast('云端连接不可用，请稍后重试','err'); return; }
  if(TURNSTILE_SITE_KEY && !_captchaToken && !_captchaDegraded){ toast('请先完成人机验证','err'); return; }
  if(_authSubmitting) return;
  _authSubmitting = true; setAuthLoading(true);
  try{
    const r = await sb.auth.signInWithPassword({email:e, password:p, options:{captchaToken:_captchaToken||undefined}});
    if(r.error){ resetTurnstile(); toast(authErrorMsg(r.error),'err'); return; }
    destroyTurnstile(); closeModal(); toast('登录成功 ✅','ok');
  }catch(err){ toast('网络错误，请检查网络后重试','err'); }
  finally{ _authSubmitting = false; setAuthLoading(false); }
}
async function doSignUp(){
  const e = cleanEmail(document.getElementById('auth-email').value);
  const p = document.getElementById('auth-password').value;
  const nEl = document.getElementById('auth-name');
  const n = nEl ? nEl.value.trim()||e.split('@')[0] : e.split('@')[0];
  const cpEl = document.getElementById('auth-confirm');
  const cp = cpEl ? cpEl.value : p;
  if(!validateEmail(e)){ toast('请输入有效的邮箱地址','err'); return; }
  if(!validatePassword(p)){ toast('密码长度至少 6 位','err'); return; }
  if(cpEl && p !== cp){ toast('两次输入的密码不一致','err'); return; }
  if(!sb){ toast('云端连接不可用，请稍后重试','err'); return; }
  if(TURNSTILE_SITE_KEY && !_captchaToken && !_captchaDegraded){ toast('请先完成人机验证','err'); return; }
  if(_authSubmitting) return;
  _authSubmitting = true; setAuthLoading(true);
  try{
    const r = await sb.auth.signUp({email:e, password:p, options:{data:{display_name:n}, captchaToken:_captchaToken||undefined}});
    if(r.error){ resetTurnstile(); toast(authErrorMsg(r.error),'err'); return; }
    destroyTurnstile(); closeModal(); toast(r.data.session?'注册成功 ✅':'注册成功！请到邮箱确认 📧','ok');
  }catch(err){ toast('网络错误，请检查网络后重试','err'); }
  finally{ _authSubmitting = false; setAuthLoading(false); }
}

let _authListenerReady = false;
function setupAuthListener(){
  if(!sb || _authListenerReady) return;
  _authListenerReady = true;
  sb.auth.onAuthStateChange(async function(ev,session){
    if(session && session.user){
      _currentUser = session.user;
      var r=await sb.from('profiles').select('*').eq('user_id', _currentUser.id).single();
      _profile = r.data || {display_name:'考研人', avatar_color:'#6366f1'};
      var rd = await sb.from('app_state').select('data').eq('user_id', _currentUser.id).maybeSingle();
      if(rd && rd.data && rd.data.data && rd.data.data.subjects){
        db = rd.data.data;                                  // 云端有数据 → 用云端
      }else if(db && db.subjects && db.subjects.length){
        try{ await sb.from('app_state').upsert({ user_id: _currentUser.id, data: db, updated_at: new Date().toISOString() }); }catch(e){} // 云端无数据 → 上传本地（首次同步）
      }
      try{ localStorage.setItem('yanxueku_v1', JSON.stringify(db)); }catch(e){}
      hideGate();
      setupRealtimeSync();
    }else{ _currentUser=null; _profile=null; renderGate(); }
    renderSidebarUser();
    if(curView) render();
  });
}

  var panel=document.getElementById('leaderboard-panel'); if(!panel) return;

    var x=await sb.from('leaderboard').select('*').limit(20);
    var data=x.data||[], rows='';
    data.forEach(function(r,i){
      var m=0; try{ JSON.parse(r.study_log||'[]').forEach(function(x){m+=x.minutes||0}); }catch(e){}
      rows+='<div class="leader-row"><div class="rank '+(i<3?'t'+(i+1):'t')+'">'+(i+1)+'</div><div class="avatar" style="width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;background:'+r.avatar_color+'">'+(r.display_name||'?').charAt(0)+'</div><div class="ld-name">'+esc(r.display_name||'考研人')+'</div><div class="ld-time">'+Math.floor(m/60)+'h '+m%60+'m</div></div>';
    });

  }catch(e){ panel.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-3)">加载失败</div>'; }

kwCard = function(k){

};
