<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="研学库">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://challenges.cloudflare.com">
<link rel="preconnect" href="https://gwihiemggugzwhutsfea.supabase.co">
<title>研学库 · 考研专业课高效学习</title>
<!-- 运行时配置（公开客户端凭据）+ 启动引导（框架逃逸/版本跳变/gate.css 切换）：外置以移除 CSP unsafe-inline -->
<script defer src="config.js?v=3.0.0-beta.26"></script>
<script defer src="boot.js?v=3.0.0-beta.26"></script>
<!-- Supabase SDK（云同步/登录依赖）：动态异步加载，不阻塞首屏渲染；加载失败自动回退本地模式 -->

<meta name="description" content="研学库 - 考研专业课高效学习系统。艾宾浩斯遗忘曲线智能复习、刷题自测、错题本、学习统计。支持多人实时同步，永久免费。">
<meta name="keywords" content="考研,专业课,艾宾浩斯,记忆复习,闪卡,刷题,学习系统">
<meta property="og:title" content="研学库 · 考研专业课高效学习系统">
<meta property="og:description" content="基于艾宾浩斯遗忘曲线的智能复习工具，支持知识库管理、刷题自测、错题本、学习统计。学习小组多人实时同步。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://luckyboom1.github.io/yanxueku/">
<meta property="og:image" content="https://luckyboom1.github.io/yanxueku/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://fastly.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: wss://*.supabase.co https://challenges.cloudflare.com; font-src 'self'; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'">

  <link rel="stylesheet" href="styles.css?v=3.0.0-beta.26">
  <!-- gate.css 只服务登录墙：异步加载不阻塞首屏渲染（media-swap 模式 + noscript 兜底） -->
  <link rel="stylesheet" id="gate-css" href="gate.css?v=3.0.0-beta.26" media="print">
  <noscript><link rel="stylesheet" href="gate.css?v=3.0.0-beta.26"></noscript>
</head>
<body>
<div class="loading-shield" id="loading-screen">
  <div class="loading-pulse"></div>
  <div class="loading-text">研学库加载中…</div>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="logo"><div class="logo-badge">研</div><span><em>研学库</em></span></div>
    <div class="nav-item active" data-view="dashboard" role="button" tabindex="0" data-act-click="switchView"><span class="ico">🏠</span>学习仪表盘<span class="nav-badge" id="badge-due" style="display:none"></span></div>
    <div class="nav-item" data-view="library" role="button" tabindex="0" data-act-click="switchView"><span class="ico">📚</span>知识库</div>
    <div class="nav-item" data-view="review" role="button" tabindex="0" data-act-click="switchView"><span class="ico">🧠</span>记忆复习</div>
    <div class="nav-item" data-view="public-library" role="button" tabindex="0" data-act-click="switchView"><span class="ico">🏛️</span>公共课程库</div>
    <div class="nav-item" data-view="quiz" role="button" tabindex="0" data-act-click="switchView"><span class="ico">✍️</span>刷题自测</div>
    <div class="nav-item" data-view="wrong" role="button" tabindex="0" data-act-click="switchView"><span class="ico">📕</span>错题本<span class="nav-badge" id="badge-wrong" style="display:none"></span></div>
    <div class="nav-item" data-view="stats" role="button" tabindex="0" data-act-click="switchView"><span class="ico">📊</span>学习统计</div>
    <div class="nav-item" data-view="mine" role="button" tabindex="0" data-act-click="switchView"><span class="ico">👤</span>我的</div>
    <div id="sidebar-user-area"></div>
    <div class="side-label" style="display:flex;align-items:center;justify-content:space-between">专业科目 <button class="add-subj-btn" data-act-click="openNewSubjectModal" title="新建科目">＋ 新建</button></div>
    <div id="subj-list"></div>
    
  <div class="side-label">⏱ 学习计时</div>
  <div id="sidebar-timer" style="text-align:center;font-size:22px;font-weight:800;letter-spacing:1px;padding:6px 0;color:var(--primary);font-variant-numeric:tabular-nums" title="今日学习时长">00:00</div>
  <div style="font-size:11px;color:var(--text-3);text-align:center;margin-top:-6px">累计 <span id="sidebar-total">0时0分</span> · 复习/刷题自动计入</div>
  <div id="sync-status" style="font-size:11px;color:var(--text-3);text-align:center;margin-top:2px;transition:color .3s">已保存</div>

  <div class="side-foot">
      <button class="foot-btn" data-act-click="exportData" title="导出全部数据">⬇ 导出</button>
      <button class="foot-btn" data-act-click="pickFile" data-arg="import-file" title="从备份 JSON 恢复数据">⬆ 恢复备份</button>
      <button class="foot-btn" id="theme-btn" data-act-click="cycleTheme" title="切换主题">🌓 主题</button>
      <input type="file" id="import-file" accept=".json" style="display:none" data-act-change="importData">
      <input type="file" id="import-cards-file" accept=".txt,.md" style="display:none" data-act-change="importCardsFile">
      <input type="file" id="import-pack-file" accept=".json" style="display:none" data-act-change="importCardPackFile">
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button class="icon-btn" data-act-click="toggleSidebar" title="收起/展开侧栏">☰</button>
      <div>
        <div id="page-title">学习仪表盘</div>
        <div id="page-sub"></div>
      </div>
      <div class="top-actions">
        <button class="btn btn-ghost" data-act-click="openKwModal"><span class="btn-plus">＋</span><span class="btn-label"> 记知识点</span></button>
        <button class="btn btn-primary" data-act-click="startReview">▶ 开始今日复习</button>
      </div>
    </header>

    <div id="content">
      <section id="view-dashboard" class="view active"></section>
      <section id="view-library" class="view"></section>
      <section id="view-review" class="view"></section>
      <section id="view-quiz" class="view"></section>
      <section id="view-wrong" class="view"></section>
      <section id="view-stats" class="view"></section>
      <section id="view-mine" class="view"></section>
      <section id="view-public-library" class="view"></section>
    </div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast-root" role="status" aria-live="polite" aria-atomic="false"></div>

<script defer src="core.js?v=3.0.0-beta.26"></script>
<script defer src="quiz_analyzer.js?v=3.0.0-beta.26"></script>
<script defer src="quiz.js?v=3.0.0-beta.26"></script>
<script defer src="ai.js?v=3.0.0-beta.26"></script>
<script defer src="views.js?v=3.0.0-beta.26"></script>
<script defer src="actions.js?v=3.0.0-beta.26"></script>
</body>
</html>
